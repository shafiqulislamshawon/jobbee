{% extends 'base.html' %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center bg-gray-50 px-4 sm:px-6 lg:px-8 rounded-3xl mt-8">
    <div class="max-w-max mx-auto text-center">
        <main class="sm:flex">
            <p class="text-4xl font-extrabold text-yellow-600 sm:text-5xl">403</p>
            <div class="sm:ml-6">

                    <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight sm:text-5xl">Access Denied</h1>
