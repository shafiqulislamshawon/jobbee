{% extends 'base.html' %}
{% block title %}Edit Coupon - Jobbee{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-extrabold text-primary">Edit Coupon: {{ coupon.code }}</h1>
            <p class="mt-2 text-sm text-gray-600">Update details for this discount code.</p>
        </div>
        <a href="{% url 'admin_coupons' %}" class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
            &larr; Back to Coupons
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-8 p-6">
        <form method="POST" action="{% url 'admin_edit_coupon' coupon.id %}" class="space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Coupon Code</label>
                    <input type="text" name="code" value="{{ coupon.code }}" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-accent focus:border-accent sm:text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Discount Type</label>
                    <select name="discount_type" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-accent focus:border-accent sm:text-sm">
                        <option value="PERCENTAGE" {% if coupon.discount_type == 'PERCENTAGE' %}selected{% endif %}>Percentage (%)</option>
                        <option value="FIXED" {% if coupon.discount_type == 'FIXED' %}selected{% endif %}>Fixed Amount ($/৳)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Discount Value</label>
                    <input type="number" step="0.01" name="discount_value" value="{{ coupon.discount_value }}" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-accent focus:border-accent sm:text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Max Uses</label>
                    <input type="number" name="max_uses" value="{{ coupon.max_uses|default_if_none:'' }}" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-accent focus:border-accent sm:text-sm" placeholder="Leave blank for unlimited">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Valid From</label>
                    <input type="datetime-local" name="valid_from" value="{{ coupon.valid_from|date:'Y-m-d\TH:i' }}" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-accent focus:border-accent sm:text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Valid To</label>
                    <input type="datetime-local" name="valid_to" value="{{ coupon.valid_to|date:'Y-m-d\TH:i'|default_if_none:'' }}" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-accent focus:border-accent sm:text-sm">
                </div>
            </div>
            <div class="flex justify-end pt-2 space-x-2">
                <a href="{% url 'admin_coupons' %}" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">Cancel</a>
                <button type="submit" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-800 transition">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
