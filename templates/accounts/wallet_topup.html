{% extends 'base.html' %}

{% block title %}Wallet Top-Up - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden bg-gray-50">
    <!-- Decorative background elements -->
    <div class="absolute top-0 -left-4 w-72 h-72 bg-accent rounded-full mix-blend-multiply filter blur-2xl opacity-20 animate-blob"></div>
    <div class="absolute top-0 -right-4 w-72 h-72 bg-primary rounded-full mix-blend-multiply filter blur-2xl opacity-20 animate-blob animation-delay-2000"></div>

    <div class="max-w-xl w-full space-y-8 bg-white/80 backdrop-blur-xl p-10 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white relative z-10">
        
        <div class="text-center">
            <div class="mx-auto w-16 h-16 bg-accent/10 rounded-2xl flex items-center justify-center mb-6 shadow-sm">
                <svg class="w-8 h-8 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">
                Top Up Wallet
            </h2>
            <p class="mt-2 text-sm text-gray-500">
                Current Balance: <span class="font-bold text-gray-900">${{ request.user.employer_profile.credits }}</span>
            </p>
        </div>

        <div class="space-y-6 mt-8">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-3">Select Amount</label>
                <div class="grid grid-cols-3 gap-3">
                    <button type="button" class="amount-btn bg-white border border-gray-200 rounded-xl py-3 px-4 text-center hover:border-accent hover:bg-accent/5 focus:outline-none focus:ring-2 focus:ring-accent transition-all duration-200" data-amount="50">
                        <span class="block text-lg font-bold text-gray-900">$50</span>
                    </button>
                    <button type="button" class="amount-btn bg-accent/10 border border-accent rounded-xl py-3 px-4 text-center ring-1 ring-accent focus:outline-none transition-all duration-200" data-amount="100">
                        <span class="block text-lg font-bold text-accent">$100</span>
                    </button>
                    <button type="button" class="amount-btn bg-white border border-gray-200 rounded-xl py-3 px-4 text-center hover:border-accent hover:bg-accent/5 focus:outline-none focus:ring-2 focus:ring-accent transition-all duration-200" data-amount="500">
                        <span class="block text-lg font-bold text-gray-900">$500</span>
                    </button>
                </div>
            </div>

            <div>
                <label for="custom_amount" class="block text-sm font-medium text-gray-700 mb-1">Or enter custom amount</label>
                <div class="relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <span class="text-gray-500 sm:text-sm">$</span>
                    </div>
                    <input type="number" id="custom_amount" class="focus:ring-accent focus:border-accent block w-full pl-7 pr-12 py-3 sm:text-sm border-gray-300 rounded-xl bg-gray-50" placeholder="0.00" value="100" min="10">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                        <span class="text-gray-500 sm:text-sm">USD</span>
                    </div>
                </div>
                <p id="amount_error" class="mt-2 text-sm text-red-600 hidden">Minimum top-up is $10</p>
            </div>
            
            <button id="pay-btn" class="w-full flex justify-center items-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-primary hover:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transform hover:-translate-y-0.5 transition-all duration-200 mt-6 disabled:opacity-50 disabled:cursor-not-allowed">
                <span>Pay with Stripe</span>
                <svg class="ml-2 -mr-1 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </div>
    </div>
</div>

<style>
    @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob {
        animation: blob 7s infinite;
    }
    .animation-delay-2000 {
        animation-delay: 2s;
    }
</style>

<script src="https://js.stripe.com/v3/"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const stripe = Stripe('{{ stripe_public_key }}');
        const customInput = document.getElementById('custom_amount');
        const payBtn = document.getElementById('pay-btn');
        const amountBtns = document.querySelectorAll('.amount-btn');
        const errorMsg = document.getElementById('amount_error');

        // Handle preset buttons
        amountBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                // Reset all buttons
                amountBtns.forEach(b => {
                    b.className = 'amount-btn bg-white border border-gray-200 rounded-xl py-3 px-4 text-center hover:border-accent hover:bg-accent/5 focus:outline-none focus:ring-2 focus:ring-accent transition-all duration-200';
                    b.querySelector('span').className = 'block text-lg font-bold text-gray-900';
                });
                
                // Set active state
                this.className = 'amount-btn bg-accent/10 border border-accent rounded-xl py-3 px-4 text-center ring-1 ring-accent focus:outline-none transition-all duration-200';
                this.querySelector('span').className = 'block text-lg font-bold text-accent';
                
                // Update input
                customInput.value = this.dataset.amount;
                validateAmount();
            });
        });

        // Handle custom input
        customInput.addEventListener('input', function() {
            // Reset all buttons
            amountBtns.forEach(b => {
                b.className = 'amount-btn bg-white border border-gray-200 rounded-xl py-3 px-4 text-center hover:border-accent hover:bg-accent/5 focus:outline-none focus:ring-2 focus:ring-accent transition-all duration-200';
                b.querySelector('span').className = 'block text-lg font-bold text-gray-900';
            });
            validateAmount();
        });

        function validateAmount() {
            const amount = parseInt(customInput.value) || 0;
            if (amount < 10) {
                errorMsg.classList.remove('hidden');
                payBtn.disabled = true;
                return false;
            } else {
                errorMsg.classList.add('hidden');
                payBtn.disabled = false;
                return true;
            }
        }

        // Handle payment
        payBtn.addEventListener('click', async function() {
            if (!validateAmount()) return;
            
            this.disabled = true;
            this.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Processing...`;
            
            const amount = parseInt(customInput.value);
            
            try {
                const response = await fetch("{% url 'create_stripe_checkout' %}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ amount: amount })
                });
                
                const session = await response.json();
                
                if (session.error) {
                    alert(session.error);
                    window.location.reload();
                    return;
                }
                
                // Redirect to Stripe Checkout
                const result = await stripe.redirectToCheckout({
                    sessionId: session.id
                });
                
                if (result.error) {
                    alert(result.error.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred. Please try again.');
            }
            
            this.disabled = false;
            this.innerHTML = `<span>Pay with Stripe</span><svg class="ml-2 -mr-1 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>`;
        });
    });
</script>
{% endblock %}
