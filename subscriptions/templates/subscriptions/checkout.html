{% extends 'base.html' %}

{% block title %}Checkout - {{ plan.name }}{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden bg-gray-50">
    <!-- Decorative background elements -->
    <div class="absolute top-0 -left-4 w-72 h-72 bg-accent rounded-full mix-blend-multiply filter blur-2xl opacity-20 animate-blob"></div>
    <div class="absolute top-0 -right-4 w-72 h-72 bg-primary rounded-full mix-blend-multiply filter blur-2xl opacity-20 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-20 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-2xl opacity-20 animate-blob animation-delay-4000"></div>

    <div class="max-w-xl w-full space-y-8 bg-white/80 backdrop-blur-xl p-10 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white relative z-10">
        
        <!-- Header -->
        <div class="text-center">
            <div class="mx-auto w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center mb-6 shadow-sm">
                <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
            </div>
            <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">
                Complete Your Purchase
            </h2>
            <p class="mt-2 text-sm text-gray-500">
                You're upgrading to the <span class="font-bold text-gray-900">{{ plan.name }}</span> plan.
            </p>
        </div>

        <!-- Order Summary -->
        <div class="bg-gray-50 rounded-xl p-6 border border-gray-100">
            <div class="flex justify-between items-center mb-2">
                <span class="text-gray-600 font-medium">Plan</span>
                <span class="text-gray-900 font-bold">{{ plan.name }}</span>
            </div>
            <div class="flex justify-between items-center text-lg mt-4 pt-4 border-t border-gray-200">
                <span class="font-bold text-gray-900">Total</span>
                <span class="font-extrabold text-accent">${{ plan.price }}</span>
            </div>
        </div>

        <!-- Payment Method Selection -->
        <div class="space-y-4 mt-6">
            <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wider">Payment Method</h3>
            
            <label class="relative flex items-start p-4 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 hover:border-gray-300 transition-all duration-200 has-[:checked]:bg-accent/5 has-[:checked]:border-accent has-[:checked]:ring-1 has-[:checked]:ring-accent shadow-sm group">
                <div class="flex items-center h-5">
                    <input type="radio" name="payment_method" value="card" checked class="sr-only" onchange="document.getElementById('use_wallet').value = 'false'">
                    <div class="w-5 h-5 rounded-full border border-gray-300 flex items-center justify-center group-has-[:checked]:border-accent group-has-[:checked]:bg-accent">
                        <div class="w-2.5 h-2.5 rounded-full bg-white opacity-0 group-has-[:checked]:opacity-100 transition-opacity"></div>
                    </div>
                </div>
                <div class="ml-4 flex-1">
                    <div class="flex justify-between">
                        <span class="block text-sm font-bold text-gray-900">Credit / Debit Card (Mock)</span>
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                    </div>
                    <span class="block text-sm text-gray-500 mt-1">Instant activation. Testing mode enabled.</span>
                </div>
            </label>
            
            <label class="relative flex items-start p-4 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 hover:border-gray-300 transition-all duration-200 has-[:checked]:bg-accent/5 has-[:checked]:border-accent has-[:checked]:ring-1 has-[:checked]:ring-accent shadow-sm group {% if request.user.employer_profile.credits < plan.price %}opacity-60 grayscale cursor-not-allowed{% endif %}">
                <div class="flex items-center h-5">
                    <input type="radio" name="payment_method" value="wallet" class="sr-only" onchange="document.getElementById('use_wallet').value = 'true'" {% if request.user.employer_profile.credits < plan.price %}disabled{% endif %}>
                    <div class="w-5 h-5 rounded-full border border-gray-300 flex items-center justify-center group-has-[:checked]:border-accent group-has-[:checked]:bg-accent">
                        <div class="w-2.5 h-2.5 rounded-full bg-white opacity-0 group-has-[:checked]:opacity-100 transition-opacity"></div>
                    </div>
                </div>
                <div class="ml-4 flex-1">
                    <div class="flex justify-between">
                        <span class="block text-sm font-bold text-gray-900">Wallet Balance</span>
                        <span class="text-sm font-bold text-gray-700">${{ request.user.employer_profile.credits }}</span>
                    </div>
                    <span class="block text-sm mt-1">
                        {% if request.user.employer_profile.credits >= plan.price %}
                            <span class="text-green-600 font-medium flex items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                                Sufficient balance
                            </span>
                        {% else %}
                            <span class="text-red-500 font-medium flex items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                Insufficient balance
                            </span>
                        {% endif %}
                    </span>
                </div>
            </label>
        </div>

        <form method="POST" action="{% url 'subscriptions:process_checkout' plan.id %}" class="mt-8">
            {% csrf_token %}
            <input type="hidden" name="use_wallet" id="use_wallet" value="false">
            <div class="space-y-3">
                <button type="submit" class="w-full flex justify-center items-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-primary hover:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transform hover:-translate-y-0.5 transition-all duration-200">
                    Confirm Purchase
                    <svg class="ml-2 -mr-1 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
                <a href="{% url 'subscriptions:pricing' %}" class="w-full flex justify-center items-center py-3.5 px-4 border border-gray-300 rounded-xl shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<style>
    @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob {
        animation: blob 7s infinite;
    }
    .animation-delay-2000 {
        animation-delay: 2s;
    }
    .animation-delay-4000 {
        animation-delay: 4s;
    }
</style>
{% endblock %}
